name: Test Jina search (one-off)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Jina search for match results
        env:
          J: ${{ secrets.JINA_API_KEY }}
        run: |
          for q in "Raufoss Ranheim 24 October 2026 result" "Shanghai Port Chengdu Rongcheng 18 October 2026 result" "Farnham Town Braintree Town 24 October 2026 result"; do
            echo "=== $q"
            curl -s -m 90 -H "Authorization: Bearer $J" -H "Accept: application/json" "https://s.jina.ai/$(printf '%s' "$q" | jq -sRr @uri)" -o /tmp/s.json -w 'http %{http_code}  %{size_download}B\n'
            jq -r '.data[:5][]? | "- " + .url + "\n    " + ((.description // .content // "") | gsub("\s+";" ") | .[0:220])' /tmp/s.json 2>/dev/null || head -c 300 /tmp/s.json
          done
