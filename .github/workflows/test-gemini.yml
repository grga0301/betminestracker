name: Test Gemini quota (one-off)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe models with and without search grounding
        env:
          K: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for m in gemini-flash-lite-latest gemini-flash-latest gemini-2.5-flash gemini-2.5-flash-lite gemini-3-flash gemini-3.1-flash-lite; do
            for tools in none search; do
              if [ $tools = search ]; then T='"tools":[{"googleSearch":{}}],'; else T=''; fi
              code=$(curl -s -o /tmp/o -w '%{http_code}' -m 60 -X POST "https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent?key=$K" -H 'Content-Type: application/json' -d "{$T\"contents\":[{\"parts\":[{\"text\":\"Final score of Raufoss vs Ranheim on 2026-10-24? Reply H-A\"}]}]}")
              printf '%-28s %-7s %s  %s\n' "$m" "$tools" "$code" "$(head -c 160 /tmp/o | tr '\n' ' ' | sed 's/  */ /g')"
            done
          done
