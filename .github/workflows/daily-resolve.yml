name: Daily Resolve

on:
  schedule:
    - cron: '30 * * * *'  # Every hour at :30 (offset from scrape)
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx prisma generate

      - name: Resolve pending doubles
        run: npm run resolve
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
