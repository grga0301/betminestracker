name: Diagnose API-Football (one-off)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Query API-Football
        env:
          K: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          echo "key length: ${#K}"
          curl -s -H "x-apisports-key: $K" https://v3.football.api-sports.io/status | jq -c '{errors, results, response}' | cut -c1-400
          curl -s -H "x-apisports-key: $K" "https://v3.football.api-sports.io/fixtures?date=2026-10-24&status=FT-AET-PEN" | jq -c '{errors, results}' | cut -c1-400
