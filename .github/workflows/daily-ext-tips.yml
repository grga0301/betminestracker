name: Scrape & Resolve External Tips

on:
  schedule:
    - cron: '30 6 * * *'  # morning (UTC)
    - cron: '45 21 * * *'  # evening (UTC) = 23:45 / 00:05 Zagreb in summer time
  workflow_dispatch:

env:
  JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  ext-tips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Scrape TipOracle + FootyAccumulators + FootballPark
        run: npm run scrape:ext
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Resolve pending external tips
        run: npm run resolve:ext
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
