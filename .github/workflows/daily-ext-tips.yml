name: Scrape & Resolve External Tips

on:
  schedule:
    - cron: '20 * * * *'  # Every hour at :20
  workflow_dispatch:

jobs:
  ext-tips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Scrape Forebet + TipOracle + FootyAccumulators
        run: npm run scrape:ext
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          FOREBET_PROXY_URL: ${{ secrets.FOREBET_PROXY_URL }}
          FOREBET_PROXY_TOKEN: ${{ secrets.FOREBET_PROXY_TOKEN }}

      - name: Resolve pending external tips
        run: npm run resolve:ext
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          FOREBET_PROXY_URL: ${{ secrets.FOREBET_PROXY_URL }}
          FOREBET_PROXY_TOKEN: ${{ secrets.FOREBET_PROXY_TOKEN }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
