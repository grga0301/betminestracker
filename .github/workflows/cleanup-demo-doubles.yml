name: Cleanup Demo Doubles (one-off)

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsx scripts/delete-demo-doubles.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
