name: Daily Scrape FreeTips

on:
  schedule:
    - cron: '30 6 * * *'  # morning (UTC)
    - cron: '45 21 * * *'  # evening (UTC) = 23:45 / 00:05 Zagreb in summer time
  workflow_dispatch:

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  scrape-ft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Scrape FreeTips.com Bet of the Day
        run: npm run scrape:ft
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
