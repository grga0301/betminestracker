name: Test SportsAPIPro (one-off)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npx tsx scripts/test-sap.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPORTSAPIPRO_KEY: ${{ secrets.SPORTSAPIPRO_KEY }}
